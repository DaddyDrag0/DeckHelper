name: DeckHelper Optimizer V2 Rework

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimizer-v2-rework.yml'

permissions:
  contents: write

jobs:
  rework:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Fix patch runner escaping and apply optimizer v2 rework
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/optimizer-v2-rework.py')
          s = p.read_text()
          old = "new_text, count = re.subn(pattern, replacement, text, count=1, flags=re.S | re.M)"
          new = "new_text, count = re.subn(pattern, lambda _match: replacement, text, count=1, flags=re.S | re.M)"
          if old not in s:
              raise SystemExit('sub_once implementation not found')
          p.write_text(s.replace(old, new, 1))
          PY
          python3 .github/scripts/optimizer-v2-rework.py

      - run: npm ci

      - name: Run optimizer checks first
        run: npm run test:optimizer

      - name: Run full project checks
        run: npm run check

      - name: Refresh GitHub Pages build
        run: |
          rm -rf assets
          cp -R dist/assets assets
          cp dist/index.html index.html

      - name: Commit and publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/optimizer-v2-rework.yml
          rm -f .github/scripts/optimizer-v2-rework.py
          git add -A
          git commit -m "Rework DeckHelper optimizer for reliable team quality"
          git pull --rebase origin main
          git push origin main
