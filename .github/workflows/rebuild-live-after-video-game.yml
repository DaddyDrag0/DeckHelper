name: Rebuild live DeckHelper after Video Game sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-live-after-video-game.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bump live version
        run: printf '2026-09-08-video-game-live-1\n' > public/version.json
      - name: Validate and build
        run: npm run check
      - name: Publish built site into Pages root
        run: |
          rm -rf assets card-images aura-images
          cp -a dist/. .
          test -f index.html
          grep -q 'assets/' index.html
          grep -R -q 'Durante' assets
          grep -R -q 'Supreme Ozzy' assets
          grep -R -q 'The Broken One' assets
      - name: Commit production build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/rebuild-live-after-video-game.yml
          git add -A
          git commit -m "Publish Video Game update to DeckHelper live site"
          git pull --rebase origin main
          git push origin HEAD:main
