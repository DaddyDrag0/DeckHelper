name: Apply Depths pool update

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-depths-pool-update.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python3 scripts/apply-depths-pool-update.py
      - run: npm ci
      - run: npm run check
      - name: Refresh deployed static build
        run: |
          rm -rf assets
          cp -R dist/assets assets
          cp dist/index.html index.html
      - name: Publish tested update
        run: |
          rm .github/workflows/apply-depths-pool-update.yml scripts/apply-depths-pool-update.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update Depths bans and enemy pool"
          git pull --rebase origin main
          git push origin HEAD:main
