name: DeckHelper UI Hotfix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/inventory-remove-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply inventory and power estimate fixes
        run: python3 .github/scripts/deckhelper-ui-hotfix.py
      - run: npm ci
      - name: Run full checks
        run: npm run check
      - name: Refresh GitHub Pages build
        run: |
          rm -rf assets
          cp -R dist/assets assets
          cp dist/index.html index.html
      - name: Commit and publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/inventory-remove-fix.yml
          rm -f .github/scripts/deckhelper-ui-hotfix.py
          git add -A
          git commit -m "Restore power estimate and simplify card removal"
          git pull --rebase origin main
          git push origin main
