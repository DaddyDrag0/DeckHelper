name: Fix DeckHelper UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-deckhelper-ui.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch header and Depth bans search
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/revamp.ts')
          text = p.read_text()

          logo = '            <div class="rv-logo">DH</div>\n'
          if logo not in text:
              raise SystemExit('DH logo markup not found')
          text = text.replace(logo, '', 1)

          old = """    const next = document.getElementById(id) as HTMLInputElement | null
    if (next) { next.focus(); next.setSelectionRange(position, position) }
"""
          new = """    const next = document.getElementById(id) as HTMLInputElement | null
    if (id === 'ban-search') {
      const details = next?.closest('details') as HTMLDetailsElement | null
      if (details) details.open = true
    }
    if (next) { next.focus(); next.setSelectionRange(position, position) }
"""
          if old not in text:
              raise SystemExit('renderAndRefocus block not found')
          text = text.replace(old, new, 1)

          p.write_text(text)
          PY
      - run: npm ci
      - run: npm run check
      - name: Publish GitHub Pages build
        run: |
          rm -rf assets
          cp -R dist/assets ./assets
          cp dist/index.html ./index.html
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-deckhelper-ui.yml
          git add -A
          git commit -m "Fix Depth bans search and simplify header"
          git pull --rebase origin main
          git push origin HEAD:main
