name: Aura columns fix

on:
  push:
    branches: [agent/aura-columns-fix]
    paths:
      - src/aura-workspace.css
      - assets/source-Dz9llA-3.css
      - .github/workflows/tmp-aura-columns.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
