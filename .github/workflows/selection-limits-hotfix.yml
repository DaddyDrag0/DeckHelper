name: DeckHelper Selection Limits Hotfix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/selection-limits-hotfix.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply selection limits and dropdown stability fixes
        run: python3 .github/scripts/deckhelper-selection-limits-hotfix.py
      - run: npm ci
      - name: Run full checks
        run: npm run check
      - name: Refresh GitHub Pages build
        run: |
          rm -rf assets
          cp -R dist/assets assets
          cp dist/index.html index.html
      - name: Commit and publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/selection-limits-hotfix.yml
          rm -f .github/scripts/deckhelper-selection-limits-hotfix.py
          git add -A
          git commit -m "Limit selected inventory and stabilize dropdowns"
          git pull --rebase origin main
          git push origin main
