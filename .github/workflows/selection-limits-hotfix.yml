# one-time DeckHelper hotfix workflow
name: DeckHelper Selection Limits Hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/selection-limits-hotfix.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply selection limits and dropdown stability fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/revamp.ts')
          s = p.read_text()

          def replace_once(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'{label} block not found')
              s = s.replace(old, new, 1)

          replace_once(
              "const AURA_BORDERS: AuraOwnedBorder[] = ['Base', 'Platinum', 'Crystal', 'Galaxy']\ntype Tab = 'optimize' | 'inventory' | 'saved'",
              "const AURA_BORDERS: AuraOwnedBorder[] = ['Base', 'Platinum', 'Crystal', 'Galaxy']\nconst MAX_SELECTED_CARDS = 15\nconst MAX_STAT_AURAS = 4\ntype Tab = 'optimize' | 'inventory' | 'saved'",
              'limits constants',
          )

          replace_once(
              '<span><b>${this.ownedCopies()}</b> cards</span>',
              '<span><b>${this.ownedCopies()}/${MAX_SELECTED_CARDS}</b> cards</span>',
              'header card count',
          )

          replace_once(
              '<div class=\"rv-section-head\"><div><h2>Your cards</h2><p>Locking here is optional. You can also lock cards directly on the Optimize page.</p></div><b>${this.state.inventory.cards.length} variants · ${this.ownedCopies()} copies</b></div>',
              '<div class=\"rv-section-head\"><div><h2>Your cards</h2><p>Locking here is optional. You can also lock cards directly on the Optimize page.</p></div><b>${this.ownedCopies()}/${MAX_SELECTED_CARDS} cards · ${this.state.inventory.cards.length} variants</b></div>',
              'inventory count',
          )

          replace_once(
              "    const description = card.ability ? abilities[card.ability] : ''\n    return `<article class=\"rv-catalog-card\">",
              "    const description = card.ability ? abilities[card.ability] : ''\n    const atCardLimit = this.ownedCopies() >= MAX_SELECTED_CARDS\n    return `<article class=\"rv-catalog-card\">",
              'catalog limit state',
          )

          replace_once(
              '<button class=\"rv-add-card ${owned ? \'owned\' : \'\'}\" data-action=\"catalog-add\" data-name=\"${escapeHtml(card.name)}\">${owned ? `Add another · owned ×${owned.quantity}` : \'+ Add to inventory\'}</button>',
              '<button class=\"rv-add-card ${owned ? \'owned\' : \'\'}\" data-action=\"catalog-add\" data-name=\"${escapeHtml(card.name)}\" ${atCardLimit ? \'disabled\' : \'\'}>${atCardLimit ? `Inventory full · ${MAX_SELECTED_CARDS}/${MAX_SELECTED_CARDS}` : owned ? `Add another · owned ×${owned.quantity}` : \'+ Add to inventory\'}</button>',
              'catalog add button',
          )

          replace_once(
              '<div class=\"rv-qty\" aria-label=\"Quantity\"><button data-action=\"qty-minus\" data-key=\"${key}\">−</button><b>×${card.quantity}</b><button data-action=\"qty-plus\" data-key=\"${key}\">+</button></div>',
              '<div class=\"rv-qty\" aria-label=\"Quantity\"><button data-action=\"qty-minus\" data-key=\"${key}\">−</button><b>×${card.quantity}</b><button data-action=\"qty-plus\" data-key=\"${key}\" ${this.ownedCopies() >= MAX_SELECTED_CARDS ? \'disabled\' : \'\'}>+</button></div>',
              'quantity plus limit',
          )

          replace_once(
              "    const normalized = canonicalBorders(borders)\n    const key = cardVariantKey(name, normalized)",
              "    if (this.ownedCopies() >= MAX_SELECTED_CARDS) {\n      this.error = `You can select up to ${MAX_SELECTED_CARDS} total card copies.`\n      this.render()\n      return\n    }\n    const normalized = canonicalBorders(borders)\n    const key = cardVariantKey(name, normalized)",
              'add card guard',
          )

          replace_once(
              "  private changeQuantity(encodedKey: string, delta: number) {\n    const card = this.findOwned(encodedKey)\n    if (!card) return\n    if (delta < 0 && card.quantity <= 1) {",
              "  private changeQuantity(encodedKey: string, delta: number) {\n    const card = this.findOwned(encodedKey)\n    if (!card) return\n    if (delta > 0 && this.ownedCopies() >= MAX_SELECTED_CARDS) {\n      this.error = `You can select up to ${MAX_SELECTED_CARDS} total card copies.`\n      this.render()\n      return\n    }\n    if (delta < 0 && card.quantity <= 1) {",
              'quantity guard',
          )

          replace_once(
              "  private renderAuraColumn(kind: AuraKind, title: string, owned: OwnedAura[], available: typeof depthSelectableAuras) {\n    return `<div class=\"rv-aura-column\"><div class=\"rv-aura-head\"><strong>${title}</strong><span>${owned.length} owned</span></div>",
              "  private renderAuraColumn(kind: AuraKind, title: string, owned: OwnedAura[], available: typeof depthSelectableAuras) {\n    const atAuraLimit = kind === 'stat' && owned.length >= MAX_STAT_AURAS\n    return `<div class=\"rv-aura-column\"><div class=\"rv-aura-head\"><strong>${title}</strong><span>${kind === 'stat' ? `${owned.length}/${MAX_STAT_AURAS}` : owned.length} owned</span></div>",
              'aura header limit',
          )

          replace_once(
              '<div class=\"rv-aura-add\"><select id=\"add-${kind}-aura\"><option value=\"\">Choose an aura…</option>${available.map((aura) => `<option value=\"${escapeHtml(aura.name)}\">${escapeHtml(aura.name)}${aura.skillName ? ` · ${escapeHtml(aura.skillName)}` : \'\'}</option>`).join(\'\')}</select><button data-action=\"add-aura\" data-kind=\"${kind}\">Add</button></div>',
              '<div class=\"rv-aura-add\"><select id=\"add-${kind}-aura\" ${atAuraLimit ? \'disabled\' : \'\'}><option value=\"\">${atAuraLimit ? `Stat Aura limit reached (${MAX_STAT_AURAS})` : \'Choose an aura…\'}</option>${available.map((aura) => `<option value=\"${escapeHtml(aura.name)}\">${escapeHtml(aura.name)}${aura.skillName ? ` · ${escapeHtml(aura.skillName)}` : \'\'}</option>`).join(\'\')}</select><button data-action=\"add-aura\" data-kind=\"${kind}\" ${atAuraLimit ? \'disabled\' : \'\'}>Add</button></div>',
              'aura add limit',
          )

          replace_once(
              "  private addAura(kind: AuraKind) {\n    const select = document.getElementById(`add-${kind}-aura`) as HTMLSelectElement | null\n    const name = select?.value || ''\n    if (!name || this.auraList(kind).some((aura) => aura.auraName === name)) return",
              "  private addAura(kind: AuraKind) {\n    const select = document.getElementById(`add-${kind}-aura`) as HTMLSelectElement | null\n    const name = select?.value || ''\n    if (!name || this.auraList(kind).some((aura) => aura.auraName === name)) return\n    if (kind === 'stat' && this.state.inventory.statAuras.length >= MAX_STAT_AURAS) {\n      this.error = `You can test up to ${MAX_STAT_AURAS} Stat Auras at a time.`\n      this.render()\n      return\n    }",
              'add aura guard',
          )

          replace_once(
              "  private loadInventory() {\n    try {\n      this.state.inventory = importInventoryCode(this.inventoryCodeText)\n      this.results = []",
              "  private loadInventory() {\n    try {\n      const imported = importInventoryCode(this.inventoryCodeText)\n      const importedCopies = imported.cards.reduce((sum, card) => sum + card.quantity, 0)\n      if (importedCopies > MAX_SELECTED_CARDS) throw new Error(`Inventory codes can contain at most ${MAX_SELECTED_CARDS} total card copies.`)\n      if (imported.statAuras.length > MAX_STAT_AURAS) throw new Error(`Inventory codes can contain at most ${MAX_STAT_AURAS} Stat Auras.`)\n      this.state.inventory = imported\n      this.results = []",
              'import limits',
          )

          replace_once(
              "    const canSearch = this.ownedCopies() >= 4 && !this.worker",
              "    const canSearch = this.ownedCopies() >= 4 && this.ownedCopies() <= MAX_SELECTED_CARDS && this.state.inventory.statAuras.length <= MAX_STAT_AURAS && !this.worker",
              'optimize can search',
          )

          replace_once(
              "    if (this.ownedCopies() < 4) {\n      this.error = 'Add at least 4 card copies before optimizing.'\n      this.tab = 'inventory'\n      this.render()\n      return\n    }\n    this.error = ''",
              "    if (this.ownedCopies() < 4) {\n      this.error = 'Add at least 4 card copies before optimizing.'\n      this.tab = 'inventory'\n      this.render()\n      return\n    }\n    if (this.ownedCopies() > MAX_SELECTED_CARDS) {\n      this.error = `Reduce your selected inventory to ${MAX_SELECTED_CARDS} card copies or fewer.`\n      this.tab = 'inventory'\n      this.render()\n      return\n    }\n    if (this.state.inventory.statAuras.length > MAX_STAT_AURAS) {\n      this.error = `Choose no more than ${MAX_STAT_AURAS} Stat Auras to test.`\n      this.tab = 'inventory'\n      this.render()\n      return\n    }\n    this.error = ''",
              'search limits',
          )

          old_worker = """    this.worker.onmessage = (event: MessageEvent<WorkerOutbound>) => {
      const message = event.data
      if (message.type === 'progress') this.progress = message.progress
      else if (message.type === 'search-result') { this.results = message.results; this.progress = null; this.finishWorker() }
      else if (message.type === 'error') { this.error = message.message; this.progress = null; this.finishWorker() }
      this.render()
    }"""
          new_worker = """    this.worker.onmessage = (event: MessageEvent<WorkerOutbound>) => {
      const message = event.data
      if (message.type === 'progress') {
        this.progress = message.progress
        if (this.tab === 'optimize') {
          const current = this.root.querySelector<HTMLElement>('.rv-progress')
          const html = this.renderProgress()
          if (current && html) current.outerHTML = html
          else if (!current) this.render()
        }
        return
      }
      if (message.type === 'search-result') { this.results = message.results; this.progress = null; this.finishWorker() }
      else if (message.type === 'error') { this.error = message.message; this.progress = null; this.finishWorker() }
      this.render()
    }"""
          replace_once(old_worker, new_worker, 'worker rerender fix')

          p.write_text(s)

          checks = [
              'const MAX_SELECTED_CARDS = 15',
              'const MAX_STAT_AURAS = 4',
              'this.ownedCopies() >= MAX_SELECTED_CARDS',
              "kind === 'stat' && owned.length >= MAX_STAT_AURAS",
              "this.root.querySelector<HTMLElement>('.rv-progress')",
          ]
          for check in checks:
              if check not in s:
                  raise SystemExit(f'missing expected patch: {check}')
          PY

      - run: npm ci
      - name: Run full checks
        run: npm run check

      - name: Refresh GitHub Pages build
        run: |
          rm -rf assets
          cp -R dist/assets assets
          cp dist/index.html index.html

      - name: Commit and publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/selection-limits-hotfix.yml
          git add -A
          git commit -m "Limit selected inventory and stabilize dropdowns"
          git pull --rebase origin main
          git push origin main